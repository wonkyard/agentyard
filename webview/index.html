<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentyard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="vendor/xterm.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="brand">AGENTYARD<span class="ver" id="brand-ver"></span></span>
      <button type="button" id="help-btn" title="도움말 · 설정 안내" aria-label="도움말 열기">?</button>
      <span id="view-toggle">
        <button type="button" data-view="office" class="on">Office</button>
        <button type="button" data-view="run">Run</button>
      </span>
    </header>
    <div id="office-pane">
      <div id="office-banner" hidden></div>
      <div id="stage-wrap">
        <canvas id="scene" width="840" height="600"></canvas>
      </div>
      <aside id="panel"></aside>
      <div id="status">connecting…</div>
    </div>
    <div id="ay-overlay" hidden><div id="ay-overlay-card" role="dialog" aria-modal="true"></div></div>
    <div id="run-pane" hidden>
      <div id="run-notice" hidden></div>
      <div id="run-term" hidden></div>
      <div id="run-term-foot" hidden>
        <span id="run-backend-switch" hidden></span>
        <button type="button" id="run-term-attach" class="attach-btn" title="Attach a file or image">📎 Attach</button>
        <button type="button" id="run-term-new">New thread</button>
        <span id="run-term-meta"></span>
      </div>
      <div id="run-feed"></div>
      <div id="run-bar">
        <div id="run-hint" hidden></div>
        <div id="run-input-row">
          <button type="button" id="run-attach" class="attach-btn" title="Attach a file or image">📎</button>
          <textarea id="run-input" rows="1" placeholder="Send a prompt to Claude Code in this workspace…"></textarea>
          <button type="button" id="run-send">Send</button>
          <button type="button" id="run-cancel" hidden>Cancel</button>
        </div>
        <div id="run-foot">
          <button type="button" id="run-new">New thread</button>
          <span id="run-meta"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- AY_CONFIG: the VS Code extension overwrites this block at load time. -->
  <script>
    // The embedded terminal needs the extension host (node-pty), so the browser
    // dev server always previews the headless feed.
    // scripts/dev-server.mjs replaces __AY_VERSION__ with package.json's version.
    window.AY_CONFIG = window.AY_CONFIG || { mode: 'browser', version: '__AY_VERSION__', pollSeconds: 3, wasmUrl: 'vendor/sql-wasm.wasm', runView: 'headless', runViewRequested: 'headless', ptyAvailable: false, platform: 'browser', agents: '__AY_AGENTS__', terminalCopyPaste: true, copyOnSelection: false, onboarded: true };
    if (window.AY_CONFIG.version === '__AY_VERSION__') window.AY_CONFIG.version = '';
    // backend list: the dev server injects it; fall back to Claude Code, and let
    // ?agents=claude-code,codex override for layout work.
    if (!Array.isArray(window.AY_CONFIG.agents)) window.AY_CONFIG.agents = ['claude-code'];
    var _am = location.search.match(/[?&]agents=([^&]+)/);
    if (_am) window.AY_CONFIG.agents = decodeURIComponent(_am[1]).split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    // ?shot -> lay the whole scene out flat for a full-page screenshot (dev only)
    if (location.search.indexOf('shot') !== -1) document.documentElement.className = 'shot';
    // ?view=run -> open the run view on load (dev / screenshot helper)
    if (/[?&]view=run/.test(location.search)) {
      window.addEventListener('DOMContentLoaded', () => {
        const b = document.querySelector('#view-toggle button[data-view="run"]');
        if (b) b.click();
      });
    }
  </script>

  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/db.js"></script>
  <script src="js/adapter.js"></script>
  <script src="js/live.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/termclip.js"></script>
  <script src="js/run.js"></script>
  <script src="js/term.js"></script>
  <script src="js/onboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
