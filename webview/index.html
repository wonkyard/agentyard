<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentyard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <canvas id="scene" width="840" height="600"></canvas>
    </div>
    <aside id="panel"></aside>
    <div id="status">connecting…</div>
  </div>

  <!-- AY_CONFIG: the VS Code extension overwrites this block at load time. -->
  <script>
    window.AY_CONFIG = window.AY_CONFIG || { mode: 'browser', pollSeconds: 3, wasmUrl: 'vendor/sql-wasm.wasm' };
    // ?shot -> lay the whole scene out flat for a full-page screenshot (dev only)
    if (location.search.indexOf('shot') !== -1) document.documentElement.className = 'shot';
  </script>

  <script src="vendor/sql-wasm.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/db.js"></script>
  <script src="js/adapter.js"></script>
  <script src="js/live.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
